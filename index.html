<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔚蓝档案 · 角色人气排序</title>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="header-left">
                <h1>角色人气排序</h1>
                <p class="subtitle">从《蔚蓝档案》的角色中选出你最喜欢的排名</p>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">已选出</span>
                    <span class="stat-value" id="statFavorites">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">剩余候选</span>
                    <span class="stat-value" id="statRemaining">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已淘汰</span>
                    <span class="stat-value" id="statEliminated">0</span>
                </div>
            </div>
        </header>

        <section class="controls">
            <div class="school-filter" id="schoolFilter">
                <button type="button" class="btn btn--ghost" id="schoolFilterBtn" aria-haspopup="true" aria-expanded="false">
                    <span>学校</span>
                    <span class="badge" id="schoolFilterCount"></span>
                    <span class="arrow">▾</span>
                </button>
                <div class="school-dropdown" id="schoolDropdown" hidden></div>
            </div>
            <label class="check"><input type="checkbox" id="playableOnly"> 仅可玩学生</label>
            <label class="check"><input type="checkbox" id="cnInstalledOnly"> 仅国服已实装</label>
            <button type="button" class="btn btn--ghost" id="resetBtn">重置</button>
        </section>

        <main class="layout">
            <section class="picking">
                <div class="section-title">请选出更喜欢的角色</div>
                <div class="tile-grid" id="evaluating"></div>

                <div class="progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText"></p>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn--primary" id="pickBtn">Pick</button>
                    <button type="button" class="btn" id="passBtn">Pass</button>
                    <button type="button" class="btn" id="undoBtn">Undo</button>
                    <button type="button" class="btn" id="redoBtn">Redo</button>
                </div>
            </section>

            <aside class="favorites">
                <div class="section-title">已选出的最爱</div>
                <div class="tile-grid tile-grid--small" id="favorites"></div>
            </aside>
        </main>

        <div class="loading" id="loading">正在加载角色数据…</div>
        <div class="error" id="error" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
