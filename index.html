<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BA Favorites</title>
</head>
<body>
    <div class="app">
        <!-- 开始页：配置角色范围 -->
        <section class="start" id="startScreen" hidden>
            <header class="start-header">
                <h1>BA Favorites</h1>
                <p class="subtitle">碧蓝档案 角色喜好排行</p>
            </header>

            <div class="start-body">
                <section class="start-section">
                    <div class="section-title">皮肤拆分</div>
                    <label class="check"><input type="checkbox" id="splitSkins"> 将每个形态（含皮肤）作为独立角色</label>
                </section>

                <section class="start-section">
                    <div class="section-title">实装范围</div>
                    <div class="radio-row">
                        <label class="check"><input type="radio" name="serverScope" value="all" checked> 不限</label>
                        <label class="check"><input type="radio" name="serverScope" value="jp"> 仅日服</label>
                        <label class="check"><input type="radio" name="serverScope" value="global"> 仅国际服</label>
                        <label class="check"><input type="radio" name="serverScope" value="cn"> 仅国服</label>
                    </div>
                </section>

                <section class="start-section">
                    <div class="section-title">角色范围</div>
                    <div class="school-groups">
                        <div class="school-group">
                            <div class="school-group-head">
                                <label class="school-group-toggle">
                                    <input type="checkbox" id="includeStudents" checked>
                                    <span>学生</span>
                                    <span class="school-group-count" id="studentCount"></span>
                                </label>
                                <button type="button" class="school-clear" id="clearStudentSchools">取消选择</button>
                            </div>
                            <div class="school-chips" id="studentSchools"></div>
                        </div>
                        <div class="school-group">
                            <div class="school-group-head">
                                <label class="school-group-toggle">
                                    <input type="checkbox" id="includeNpcs" checked>
                                    <span>NPC</span>
                                    <span class="school-group-count" id="npcCount"></span>
                                </label>
                                <button type="button" class="school-clear" id="clearNpcSchools">取消选择</button>
                            </div>
                            <div class="school-chips" id="npcSchools"></div>
                        </div>
                    </div>
                    <p class="start-hint">学校未勾选时，包含该栏全部学校</p>
                </section>

                <section class="start-section">
                    <div class="section-title">每批卡片数</div>
                    <span class="select-shell">
                        <select id="batchSize"></select>
                    </span>
                </section>
            </div>

            <section class="save-panel" id="savePanel" hidden>
                <div class="save-card">
                    <div class="save-head">
                        <div class="save-head-left">
                            <span class="save-title">上次进度</span>
                            <span class="save-mode" id="saveMode">普通</span>
                        </div>
                        <span class="save-time" id="saveTime"></span>
                    </div>
                    <div class="save-metrics">
                        <span class="save-metric"><strong id="saveFavorites">0</strong>已选出</span>
                        <span class="save-metric"><strong id="saveRemaining">0</strong>剩余候选</span>
                        <span class="save-metric"><strong id="saveEliminated">0</strong>已淘汰</span>
                    </div>
                    <p class="save-config" id="saveConfig"></p>
                    <p class="save-diff" id="saveDiff" hidden>
                        当前配置与存档不同，载入存档配置后才能继续
                        <button type="button" class="ba-btn ba-btn--ghost ba-btn--sm" id="restoreSaveBtn">载入存档配置</button>
                    </p>
                    <div class="save-actions">
                        <button type="button" class="ba-btn" id="continueBtn">继续上次</button>
                        <button type="button" class="ba-btn ba-btn--gray ba-btn--sm" id="deleteSaveBtn">删除存档</button>
                    </div>
                </div>
                <p class="save-other" id="saveOther" hidden>
                    另一模式（<span id="saveOtherMode">普通</span>）也有一份存档
                    <button type="button" class="save-link" id="switchModeBtn">切换查看</button>
                </p>
            </section>

            <footer class="start-actions">
                <div class="start-summary">
                    <span class="start-count" id="itemCount"></span>
                </div>
                <div class="start-buttons">
                    <button type="button" class="ba-btn ba-btn--accent" id="startBtn">开始</button>
                </div>
            </footer>
        </section>

        <!-- 选择页 -->
        <section class="picker" id="pickerScreen" hidden>
            <header class="app-header">
                <div class="header-left">
                    <h1>角色喜好排序</h1>
                    <p class="subtitle">从《蔚蓝档案》的角色中选出你最喜欢的排名</p>
                </div>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">已选出</span>
                        <span class="stat-value" id="statFavorites">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">剩余候选</span>
                        <span class="stat-value" id="statRemaining">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">已淘汰</span>
                        <span class="stat-value" id="statEliminated">0</span>
                    </div>
                </div>
            </header>

            <section class="controls">
                <span class="scope-summary" id="scopeSummary"></span>
                <button type="button" class="ba-btn ba-btn--gray" id="backBtn">返回设置</button>
                <button type="button" class="ba-btn ba-btn--gray" id="resetBtn">重置</button>
            </section>

            <main class="layout">
                <section class="picking">
                    <div class="section-title">请选出更喜欢的角色</div>
                    <div class="tile-grid" id="evaluating"></div>

                    <div class="progress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p class="progress-text" id="progressText"></p>
                    </div>

                    <div class="actions">
                        <button type="button" class="ba-btn ba-btn--accent" id="pickBtn">Pick</button>
                        <button type="button" class="ba-btn" id="passBtn">Pass</button>
                        <button type="button" class="ba-btn ba-btn--ghost" id="undoBtn">Undo</button>
                        <button type="button" class="ba-btn ba-btn--ghost" id="redoBtn">Redo</button>
                    </div>
                </section>

                <aside class="favorites">
                    <div class="section-title">我的最爱</div>
                    <div class="tile-grid tile-grid--small" id="favorites"></div>
                </aside>
            </main>
        </section>

        <div class="loading" id="loading">正在加载角色数据…</div>
        <div class="error" id="error" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
