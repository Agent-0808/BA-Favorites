<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="initial-scale=1.0">
<title>Picker</title>
<style>
body {
    background:#FFF;
    color:#000;
    font-family:verdana, sans-serif;
    font-size:10pt;
    margin:0;
    padding:10px;
}

a:link, a:visited {
    color:#008;
    font-weight:bold;
    text-decoration:none;
}

a:active, a:hover {
    color:#ACF;
}

.info {
    font-weight:bold;
}

button {
    font-family:inherit;
    cursor:pointer;
    border:0;
    border-radius:3px;
    padding:0.3em 0.5em;
    background:#CCC;
    color:#000;
}

button:hover {
    background:#DDD;
}

button.disabled {
    background:#DDD;
    color:#888;
    cursor:not-allowed;
}

button.disabled:hover {
    background:#DDD;
}

#container {
    position:relative;
    margin-left:-10px;
    margin-right:-10px;
    padding:10px;
    overflow:hidden;
}

@media (min-width:1024px) {
    /* Put the found favorites beside the picking div when the window is sufficiently large */
    #picking {
        float:left;
        width:636px;
    }

    #secondary {
        margin-left:646px;
    }
}

@media (min-width:1300px) {
    /* Once we get to the point where 636px is less than half of the width of the screen, make the picking div just take up half */
    #picking {
        width:50%;
    }

    #secondary {
        margin-left:51%;
    }
}

#pick {
    background:#58F;
    color:#FFF;
    font-size:larger;
    font-weight:bold;
    width:6em;
    border-radius:5px;
    margin-right:10px;
}

#pick.disabled {
    background:#ACF;
}

#pick:hover {
    background:#ACF;
}

.item-list {
    padding:0;
    list-style-type:none;
    line-height:100px;
}

.item-list li {
    margin:0;
    display:inline-block;
    height:100px;
    width:100px;
    line-height:100px;
    border:3px solid transparent;
    text-align:center;
    position:relative;
    vertical-align:top;
    overflow:hidden;
    border-radius:100%;
    background:#F7F7F7;
    color:#000;
}

.item-list li img {
    vertical-align:middle;
    max-height:100%;
    max-width:100%;
}

.item-list li span {
    display:inline-block;
    vertical-align:middle;
    line-height:1.2;
}

@media (max-width:636px) {
    .item-list {
        line-height:75px;
    }

    .item-list li {
        line-height:75px;
        height:75px;
        width:75px;
    }
}

@media (max-width:423px) {
    .item-list {
        line-height:50px;
    }

    .item-list li {
        line-height:50px;
        height:50px;
        width:50px;
    }
}

#evaluating li {
    cursor:pointer;
}

#favorites li {
    cursor:move;
}

.item-list li:hover {
    background:#CDF;
}

.item-list.sorting li:hover {
    background:#F7F7F7;
}

#evaluating li.selected {
    border:3px solid #7AC;
}

#evaluating, #buttons {
    text-align:center;
    margin:auto;
}

#evaluating li.notice {
    width:auto;
    height:auto;
    max-width:260px;
    margin:auto;
    background:#F7F7F7;
    border-radius:10px;
    padding:30px 30px;
    color:#000;
    text-align:center;
    line-height:1.4;
    cursor:auto;
    font-size:10pt;
}

#buttons {
    margin-top:30px;
    position:relative;
    z-index:3;
}

#data-status {
    font-weight:bold;
}

#data-import, #filters {
    margin:10px 0;
}

#filters label {
    display:inline-block;
    margin-right:12px;
}
</style>
</head>
<body>
<h1>Picker</h1>

<p>You can include any content you want here.</p>

<p id="data-status">正在加载数据…</p>

<div id="data-import" hidden>
    <p>无法自动读取 <code>data/students.json</code>（例如用 file:// 直接打开页面时）。请手动选择数据文件：</p>
    <input type="file" id="data-file" accept=".json,application/json">
</div>

<div id="filters" hidden>
    <label><input type="checkbox" id="playable-only"> 仅可玩学生</label>
    <label><input type="checkbox" id="cn-installed-only"> 仅国服已实装</label>
    <label>学校：<select id="school"><option value="0">全部学校</option></select></label>
</div>

<div id="container">

<div id="picking">
<ul id="evaluating" class="item-list">
</ul>

<p id="buttons"><button id="pick">Pick</button> <button id="pass">Pass</button> <button id="undo">Undo</button> <button id="redo">Redo</button></p>
</div>

<div id="secondary">
<h2>Found favorites</h2>

<ol id="favorites" class="item-list">
</ol>
</div>
</div>
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="picker.js"></script>
<script src="picker-ui.js"></script>
<script src="picker-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.7.0/Sortable.min.js"></script>
<script>
'use strict';

/* 数据源配置：数据文件外置，替换 data/ 下的 JSON 即可更新角色列表 */
var DATA_URL = 'data/students.json';
var SCHOOLS_URL = 'data/schools.json';

var myPicker = null;
var pickerUI = null;

/**
 * @param {string} text
 */
function setStatus(text) {
    $('#data-status').text(text);
}

/**
 * 用角色数据初始化 picker，重复调用会被忽略。
 * @param {Array<Object>} students
 * @param {Array<Object>} schools
 */
function startPicker(students, schools) {
    if (myPicker) return;

    var items = PickerData.parseStudents(students, schools);
    var schoolOptions = PickerData.makeSchoolOptions(students, schools);

    var $school = $('#school');
    schoolOptions.forEach(function (school) {
        $school.append($('<option>').val(school.id).text(school.name));
    });

    myPicker = new picker.Picker({
        items: items,
        defaultSettings: {
            playableOnly: false,
            cnInstalledOnly: false,
            schoolId: '0'
        },
        shouldIncludeItem: function (item, settings) {
            if (settings.playableOnly && item.isNpc) return false;
            if (settings.cnInstalledOnly && !item.isInstallCn) return false;
            if (Number(settings.schoolId) && item.schoolId !== Number(settings.schoolId)) return false;
            return true;
        }
    });

    pickerUI = new PickerUI(myPicker, {
        elements: {
            pick: "#pick",
            pass: "#pass",
            undo: "#undo",
            redo: "#redo",
            evaluating: "#evaluating",
            favorites: "#favorites",
            settings: {
                playableOnly: '#playable-only',
                cnInstalledOnly: '#cn-installed-only',
                schoolId: '#school'
            }
        }
    });

    pickerUI.initialize();

    $('#data-import').prop('hidden', true);
    $('#filters').prop('hidden', false);
    setStatus('已载入 ' + items.length + ' 个角色。');

    /* Sortable favorites - you can safely remove this, and the Sortable.min.js script, if you don't want to be able to sort your favorite list. */
    var sortable = new Sortable(pickerUI.elem.favorites.get(0), {
        draggable: '.item',
        animation: 100,
        onStart: function() {
            pickerUI.elem.favorites.addClass("sorting");
        },
        onEnd: function() {
            pickerUI.elem.favorites.removeClass("sorting");
        },
        onUpdate: function() {
            myPicker.setFavorites(pickerUI.elem.favorites.children().map(function() {
                return pickerUI.getItem(this);
            }).get());
            pickerUI.update(true);
        }
    });
    /* End sortable favorites */
}

/* 学校列表加载失败时退回“学校 N”的占位名称，不影响角色导入 */
function loadSchools() {
    return PickerData.fetchJson(SCHOOLS_URL).catch(function () {
        return [];
    });
}

/* 文件兜底：file:// 下 fetch 会被浏览器拦截，此时由用户手动选择数据文件 */
$('#data-file').on('change', function () {
    var file = this.files && this.files[0];
    if (!file) return;

    setStatus('正在读取 ' + file.name + '…');
    PickerData.readJsonFile(file)
        .then(function (students) {
            return loadSchools().then(function (schools) {
                startPicker(students, schools);
            });
        })
        .catch(function (err) {
            setStatus('导入失败：' + (err && err.message ? err.message : err));
        });
});

/* 自动加载外置数据文件 */
PickerData.fetchJson(DATA_URL)
    .then(function (students) {
        return loadSchools().then(function (schools) {
            startPicker(students, schools);
        });
    })
    .catch(function (err) {
        setStatus('无法自动读取 ' + DATA_URL + '：' + (err && err.message ? err.message : err));
        $('#data-import').prop('hidden', false);
    });
</script>
</body>
</html>
